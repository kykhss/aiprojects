<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-label="Three-Sensor Line Detector wiring diagram">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient></defs>
<style>.title{font:800 38px Arial,sans-serif;fill:#192d46}.kicker{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#457bcb}.row{font:700 21px Arial,sans-serif;fill:#26394f}.minor{font:500 15px Arial,sans-serif;fill:#64758a}.note{font:600 19px Arial,sans-serif;fill:#34475f}</style>
<rect width="1280" height="820" rx="26" fill="url(#bg)"/><rect x="40" y="35" width="1200" height="750" rx="28" fill="#fff" stroke="#d9e4f0" stroke-width="3"/>
<text x="78" y="95" class="kicker">LEFT • CENTRE • RIGHT</text><text x="78" y="150" class="title">Three-Sensor Line Detector</text>
<rect x="78" y="205" width="500" height="420" rx="24" fill="#25364d"/><rect x="115" y="240" width="426" height="75" rx="15" fill="#354b65"/><text x="328" y="288" text-anchor="middle" font-size="31" font-weight="800" fill="#fff">ARDUINO UNO</text><rect x="135" y="345" width="386" height="230" rx="18" fill="#e8eef5"/><text x="328" y="405" text-anchor="middle" font-size="27" font-weight="800" fill="#26394f">INPUT / OUTPUT PINS</text><text x="328" y="455" text-anchor="middle" font-size="22" fill="#40556e">D2 – D13  •  A0 – A5</text><text x="328" y="505" text-anchor="middle" font-size="22" fill="#40556e">5V  •  GND</text><circle cx="165" cy="600" r="9" fill="#f4c64e"/><text x="185" y="608" font-size="18" fill="#fff">USB to computer</text>
<rect x="78" y="324" width="500" height="62" rx="15" fill="#fff" stroke="#e76f51" stroke-width="3"/><circle cx="105" cy="355" r="9" fill="#e76f51"/><text x="128" y="362" class="row">5V → all VCC pins</text><rect x="78" y="424" width="500" height="62" rx="15" fill="#fff" stroke="#457bcb" stroke-width="3"/><circle cx="105" cy="455" r="9" fill="#457bcb"/><text x="128" y="462" class="row">GND → all GND pins</text><rect x="78" y="524" width="500" height="62" rx="15" fill="#fff" stroke="#2a9d70" stroke-width="3"/><circle cx="105" cy="555" r="9" fill="#2a9d70"/><text x="128" y="562" class="row">D2 ← Left OUT | D3 ← Centre OUT | D4 ← Right OUT</text><rect x="760" y="205" width="430" height="420" rx="24" fill="#f4f8fc" stroke="#d9e4f0" stroke-width="3"/><text x="975" y="285" text-anchor="middle" font-size="25" font-weight="800" fill="#26394f">Three IR sensor modules</text><rect x="900" y="375" width="200" height="125" rx="18" fill="#28765f" stroke="#175342" stroke-width="5"/><circle cx="950" cy="438" r="25" fill="#dce6f0"/><circle cx="1050" cy="438" r="25" fill="#dce6f0"/><circle cx="1000" cy="390" r="10" fill="#f4c64e"/><circle cx="900" cy="545" r="18" fill="#dce6f0"/><circle cx="1000" cy="545" r="18" fill="#dce6f0"/><circle cx="1100" cy="545" r="18" fill="#dce6f0"/><text x="975" y="660" text-anchor="middle" font-size="17" font-weight="700" fill="#718096">COMPONENT / MODULE</text>
<rect x="78" y="690" width="1120" height="95" rx="18" fill="#fff7e6" stroke="#efd18a" stroke-width="2"/><text x="105" y="742" class="note">The example assumes LOW means line detected. Adjust sensor height and test your surface.</text></svg>