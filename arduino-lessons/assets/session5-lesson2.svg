<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-label="Sweeping Servo wiring diagram">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient></defs>
<style>.title{font:800 38px Arial,sans-serif;fill:#192d46}.kicker{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#457bcb}.row{font:700 21px Arial,sans-serif;fill:#26394f}.minor{font:500 15px Arial,sans-serif;fill:#64758a}.note{font:600 19px Arial,sans-serif;fill:#34475f}</style>
<rect width="1280" height="820" rx="26" fill="url(#bg)"/><rect x="40" y="35" width="1200" height="750" rx="28" fill="#fff" stroke="#d9e4f0" stroke-width="3"/>
<text x="78" y="95" class="kicker">0° → 180° → 0°</text><text x="78" y="150" class="title">Sweeping Servo</text>
<rect x="78" y="205" width="500" height="420" rx="24" fill="#25364d"/><rect x="115" y="240" width="426" height="75" rx="15" fill="#354b65"/><text x="328" y="288" text-anchor="middle" font-size="31" font-weight="800" fill="#fff">ARDUINO UNO</text><rect x="135" y="345" width="386" height="230" rx="18" fill="#e8eef5"/><text x="328" y="405" text-anchor="middle" font-size="27" font-weight="800" fill="#26394f">INPUT / OUTPUT PINS</text><text x="328" y="455" text-anchor="middle" font-size="22" fill="#40556e">D2 – D13  •  A0 – A5</text><text x="328" y="505" text-anchor="middle" font-size="22" fill="#40556e">5V  •  GND</text><circle cx="165" cy="600" r="9" fill="#f4c64e"/><text x="185" y="608" font-size="18" fill="#fff">USB to computer</text>
<rect x="78" y="324" width="500" height="62" rx="15" fill="#fff" stroke="#e76f51" stroke-width="3"/><circle cx="105" cy="355" r="9" fill="#e76f51"/><text x="128" y="362" class="row">D9 → Signal</text><rect x="78" y="424" width="500" height="62" rx="15" fill="#fff" stroke="#457bcb" stroke-width="3"/><circle cx="105" cy="455" r="9" fill="#457bcb"/><text x="128" y="462" class="row">External regulated 5V → Red</text><rect x="78" y="524" width="500" height="62" rx="15" fill="#fff" stroke="#2a9d70" stroke-width="3"/><circle cx="105" cy="555" r="9" fill="#2a9d70"/><text x="128" y="562" class="row">Shared GND → Brown/Black</text><rect x="760" y="205" width="430" height="420" rx="24" fill="#f4f8fc" stroke="#d9e4f0" stroke-width="3"/><text x="975" y="285" text-anchor="middle" font-size="25" font-weight="800" fill="#26394f">Hobby servo motor</text><rect x="930" y="430" width="140" height="115" rx="22" fill="#e6edf5" stroke="#6b7b90" stroke-width="5"/><circle cx="1000" cy="450" r="23" fill="#6b7b90"/><path d="M1000 450 L1000 320 M1000 450 L910 350 M1000 450 L1090 350" stroke="#efb93f" stroke-width="10" stroke-linecap="round"/><path d="M910 380 Q1000 250 1090 380" fill="none" stroke="#457bcb" stroke-width="5" stroke-dasharray="10 9"/><text x="975" y="660" text-anchor="middle" font-size="17" font-weight="700" fill="#718096">COMPONENT / MODULE</text>
<rect x="78" y="690" width="1120" height="95" rx="18" fill="#fff7e6" stroke="#efd18a" stroke-width="2"/><text x="105" y="742" class="note">A for loop moves the angle up and down. The delay controls how quickly the servo sweeps.</text></svg>