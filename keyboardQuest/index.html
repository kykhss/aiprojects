<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Keyboard Quest with Pip!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #FF5A5F;
    --red-dark: #D6383D;
    --blue: #3FA7FF;
    --blue-dark: #1E7FD6;
    --yellow: #FFC93C;
    --yellow-dark: #E0A400;
    --green: #4CD97B;
    --green-dark: #22B25A;
    --purple: #B57BFF;
    --purple-dark: #8A4FE0;
    --ink: #2B2A4C;
    --paper: #F6F8FF;
    --card: #FFFFFF;
    --shadow: 0 8px 0 rgba(43,42,76,0.12);
    --shadow-sm: 0 4px 0 rgba(43,42,76,0.1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% 15%, #FFEBF0 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #E8F4FF 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #EAFDED 0%, transparent 40%),
      var(--paper);
    color: var(--ink);
    overflow-x: hidden;
    user-select: none;
  }

  #app {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px 14px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  
  header h1 {
    margin: 0;
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  header h1 .highlight { color: var(--purple-dark); }

  .badge-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  
  .badge {
    background: var(--card);
    border: 2.5px solid #E2E4F6;
    border-radius: 18px;
    padding: 6px 14px;
    box-shadow: var(--shadow-sm);
    font-weight: 700;
    font-size: clamp(13px, 3vw, 16px);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  
  .badge .star { color: var(--yellow-dark); }
  .badge .error-icon { color: var(--red); }
  .badge .accuracy-icon { color: var(--blue-dark); }

  #filter-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--card);
    padding: 8px 12px;
    border-radius: 20px;
    border: 2px solid #E2E4F6;
    box-shadow: var(--shadow-sm);
    flex-wrap: wrap;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: #F0F2FB;
    border: none;
    padding: 6px 12px;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    color: #6C6B8B;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn.active {
    background: var(--purple-dark);
    color: white;
    box-shadow: 0 3px 0 var(--purple);
  }

  .toggle-btn {
    background: #F0F2FB;
    border: none;
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .robot-row {
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 12px;
  }

  #robot {
    width: 72px;
    height: 72px;
    flex: 0 0 auto;
    filter: drop-shadow(0 4px 0 rgba(43,42,76,0.12));
    transition: transform 0.2s ease;
    cursor: pointer;
  }
  #robot.bounce { animation: bounce 0.5s ease; }
  #robot.shake { animation: shake 0.4s ease; }

  @keyframes bounce {
    0% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(-12px) rotate(-5deg); }
    60% { transform: translateY(0) rotate(5deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  #speech {
    position: relative;
    background: var(--card);
    border: 2.5px solid #E2E4F6;
    border-radius: 20px;
    padding: 10px 16px;
    box-shadow: var(--shadow-sm);
    font-size: clamp(14px, 3.2vw, 17px);
    font-weight: 700;
    min-height: 52px;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
  }
  #speech:before {
    content: "";
    position: absolute;
    left: -11px;
    bottom: 16px;
    border: 10px solid transparent;
    border-right-color: var(--card);
  }
  #speech:after {
    content: "";
    position: absolute;
    left: -14px;
    bottom: 16px;
    border: 10px solid transparent;
    border-right-color: #E2E4F6;
    z-index: -1;
  }
  #speech.pulse { animation: pulse 0.3s ease; }
  @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.02);} 100%{transform:scale(1);} }

  #game-card {
    width: 100%;
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    border: 3.5px solid #E8EAFA;
    position: relative;
  }

  .category-pill {
    background: linear-gradient(135deg, var(--purple-dark), var(--blue-dark));
    color: #fff;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }

  #target-icon {
    font-size: clamp(65px, 14vw, 95px);
    line-height: 1;
    margin: 2px 0;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,0.08));
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #word-display {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 4px;
  }

  .letter-slot {
    width: clamp(38px, 7.5vw, 52px);
    height: clamp(48px, 9vw, 62px);
    border: 3px solid #D7DAF5;
    border-bottom: 6px solid var(--purple-dark);
    border-radius: 14px;
    background: #F8F9FE;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 5.5vw, 34px);
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .letter-slot.typed {
    background: #E8FDEB;
    border-color: var(--green-dark);
    border-bottom-color: var(--green-dark);
    color: var(--green-dark);
    transform: scale(1.05);
  }
  
  .letter-slot.current {
    border-color: var(--blue);
    border-bottom-color: var(--blue-dark);
    background: #EFF7FF;
    animation: slotGlow 1s infinite alternate;
  }
  @keyframes slotGlow {
    0% { box-shadow: 0 0 0px var(--blue); transform: translateY(0); }
    100% { box-shadow: 0 0 12px var(--blue); transform: translateY(-3px); }
  }

  #keyboard {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 6px;
  }

  .kb-row {
    display: flex;
    justify-content: center;
    gap: 5px;
    width: 100%;
  }

  .key {
    background: var(--card);
    border: 2px solid #DDE0F4;
    border-radius: 12px;
    box-shadow: 0 5px 0 #CBD0E8;
    font-size: clamp(15px, 3.8vw, 22px);
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    flex: 1;
    max-width: 60px;
    height: clamp(44px, 8.5vw, 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  
  .key:active, .key.active-key {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #CBD0E8;
  }
  
  .key.target-key {
    background: #EFF7FF;
    border-color: var(--blue);
    color: var(--blue-dark);
    box-shadow: 0 5px 0 var(--blue);
  }
  
  .key.wrong-key-anim {
    background: #FFE8E8 !important;
    border-color: var(--red) !important;
    color: var(--red-dark) !important;
    box-shadow: 0 5px 0 var(--red-dark) !important;
    animation: keyShake 0.25s ease;
  }
  @keyframes keyShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  #controls {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
  }

  .btn {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    box-shadow: 0 5px 0 #181730;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.1s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #181730; }

  .btn-skip { background: #6C6B8B; box-shadow: 0 5px 0 #4A4A63; }
  .btn-skip:active { box-shadow: 0 2px 0 #4A4A63; }

  #win-screen {
    position: fixed;
    inset: 0;
    background: rgba(43,42,76,0.65);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #win-screen.show { opacity: 1; pointer-events: auto; }

  #win-card {
    background: var(--card);
    border-radius: 32px;
    padding: 32px 28px;
    text-align: center;
    max-width: 440px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transform: translateY(30px) scale(0.9);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 4px solid #E8EAFA;
  }
  #win-screen.show #win-card { transform: translateY(0) scale(1); }

  #win-card .stars { font-size: 44px; margin-bottom: 4px; }
  #win-card h2 { margin: 6px 0; font-size: clamp(24px, 6vw, 30px); }
  
  .stats-summary {
    background: #F6F8FF;
    border-radius: 20px;
    padding: 14px;
    margin: 16px 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    border: 2px solid #E2E4F6;
  }
  
  .stat-box { display: flex; flex-direction: column; align-items: center; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--purple-dark); }
  .stat-lbl { font-size: 12px; font-weight: 700; color: #6C6B8B; }

  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 12px;
    height: 16px;
    z-index: 1001;
    opacity: 0.95;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1><span class="highlight">Keyboard</span> Quest!</h1>
    <div class="badge-row">
      <div class="badge" title="Score"><span class="star">⭐</span> <span id="score">0</span></div>
      <div class="badge" title="Mistakes"><span class="error-icon">❌</span> <span id="wrong-count">0</span></div>
      <div class="badge" title="Accuracy"><span class="accuracy-icon">🎯</span> <span id="accuracy">100%</span></div>
    </div>
  </header>

  <!-- Filter & Settings Bar -->
  <div id="filter-bar">
    <div class="filter-group">
      <span style="font-size:12px; font-weight:700; color:#6C6B8B;">CATEGORY:</span>
      <button class="filter-btn active" data-cat="ALL">ALL</button>
      <button class="filter-btn" data-cat="Fruit">🍎 FRUITS</button>
      <button class="filter-btn" data-cat="Vegetable">🥕 VEGGIES</button>
      <button class="filter-btn" data-cat="Animal">🦁 ANIMALS</button>
      <button class="filter-btn" data-cat="Bird">🦜 BIRDS</button>
    </div>
    <div class="filter-group">
      <button class="toggle-btn" id="hint-toggle" title="Toggle Key Highlight Hint">💡</button>
      <button class="toggle-btn" id="sound-toggle" title="Toggle Sound Effects">🔊</button>
    </div>
  </div>

  <!-- Pip the Robot Header Row -->
  <div class="robot-row">
    <svg id="robot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="38" width="40" height="36" rx="10" fill="#B9C4D0"/>
      <rect x="38" y="18" width="24" height="22" rx="8" fill="#DCE3EA"/>
      <circle cx="46" cy="28" r="4" fill="#2B2A4C"/>
      <circle cx="58" cy="28" r="4" fill="#2B2A4C"/>
      <rect x="47" y="8" width="6" height="10" rx="3" fill="#B9C4D0"/>
      <circle cx="50" cy="6" r="5" fill="#B57BFF"/>
      <rect x="16" y="44" width="14" height="10" rx="5" fill="#DCE3EA"/>
      <rect x="70" y="44" width="14" height="10" rx="5" fill="#DCE3EA"/>
      <rect x="40" y="52" width="20" height="8" rx="4" fill="#4CD97B"/>
    </svg>
    <div id="speech">Hi! I'm Pip. Type the letters on your keyboard or tap the screen keys!</div>
  </div>

  <div id="game-card">
    <div id="category-pill" class="category-pill">FRUIT</div>
    <div id="target-icon">🍎</div>
    <div id="word-display"></div>
  </div>

  <!-- Virtual On-Screen Keyboard -->
  <div id="keyboard">
    <div class="kb-row" id="row-1"></div>
    <div class="kb-row" id="row-2"></div>
    <div class="kb-row" id="row-3"></div>
  </div>

  <div id="controls">
    <button class="btn btn-skip" id="skip-btn">⏩ Skip Word</button>
    <button class="btn" id="reset-btn">🔄 Reset Quest</button>
  </div>
</div>

<!-- Victory / Summary Modal -->
<div id="win-screen">
  <div id="win-card">
    <div class="stars">⭐⭐⭐</div>
    <h2>Quest Completed!</h2>
    <p style="margin:0; color:#6C6B8B; font-weight:700;">You typed all the items wonderfully!</p>
    
    <div class="stats-summary">
      <div class="stat-box">
        <span class="stat-val" id="final-score">0</span>
        <span class="stat-lbl">SCORE</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="final-misses">0</span>
        <span class="stat-lbl">MISSES</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="final-accuracy">100%</span>
        <span class="stat-lbl">ACCURACY</span>
      </div>
    </div>

    <button class="btn" id="play-again" style="background:var(--green-dark); box-shadow:0 5px 0 #187A3F; margin:0 auto; padding:12px 30px; font-size:17px;">Play Again</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Category Dictionary Data
  var WORD_BANK = [
    // Fruits
    { word: "APPLE", cat: "Fruit", icon: "🍎" },
    { word: "BANANA", cat: "Fruit", icon: "🍌" },
    { word: "GRAPE", cat: "Fruit", icon: "🍇" },
    { word: "MANGO", cat: "Fruit", icon: "🥭" },
    { word: "PEACH", cat: "Fruit", icon: "🍑" },
    { word: "CHERRY", cat: "Fruit", icon: "🍒" },
    { word: "LEMON", cat: "Fruit", icon: "🍋" },
    { word: "MELON", cat: "Fruit", icon: "🍉" },
    { word: "KIWI", cat: "Fruit", icon: "🥝" },
    { word: "ORANGE", cat: "Fruit", icon: "🍊" },
    
    // Vegetables
    { word: "CARROT", cat: "Vegetable", icon: "🥕" },
    { word: "CORN", cat: "Vegetable", icon: "🌽" },
    { word: "BROCCOLI", cat: "Vegetable", icon: "🥦" },
    { word: "TOMATO", cat: "Vegetable", icon: "🍅" },
    { word: "ONION", cat: "Vegetable", icon: "🧅" },
    { word: "POTATO", cat: "Vegetable", icon: "🥔" },
    { word: "PEPPER", cat: "Vegetable", icon: "🫑" },
    { word: "GARLIC", cat: "Vegetable", icon: "🧄" },

    // Animals
    { word: "LION", cat: "Animal", icon: "🦁" },
    { word: "TIGER", cat: "Animal", icon: "🐯" },
    { word: "RABBIT", cat: "Animal", icon: "🐰" },
    { word: "MONKEY", cat: "Animal", icon: "🐒" },
    { word: "PANDA", cat: "Animal", icon: "🐼" },
    { word: "ELEPHANT", cat: "Animal", icon: "🐘" },
    { word: "KOALA", cat: "Animal", icon: "🐨" },
    { word: "BEAR", cat: "Animal", icon: "🐻" },
    { word: "ZEBRA", cat: "Animal", icon: "🦓" },

    // Birds
    { word: "DUCK", cat: "Bird", icon: "🦆" },
    { word: "OWL", cat: "Bird", icon: "🦉" },
    { word: "PARROT", cat: "Bird", icon: "🦜" },
    { word: "EAGLE", cat: "Bird", icon: "🦅" },
    { word: "SWAN", cat: "Bird", icon: "🦢" },
    { word: "PENGUIN", cat: "Bird", icon: "🐧" },
    { word: "FLAMINGO", cat: "Bird", icon: "🦩" },
    { word: "CROW", cat: "Bird", icon: "🐦" }
  ];

  var KEYBOARD_ROWS = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["Z","X","C","V","B","N","M"]
  ];

  // Game state
  var selectedCategory = "ALL";
  var currentList = [];
  var currentIndex = 0;
  var charIndex = 0;
  var score = 0;
  var wrongCount = 0;
  var correctKeyPresses = 0;
  var totalKeyPresses = 0;
  var showHint = true;
  var soundEnabled = true;
  var keyMap = {};

  // DOM Elements
  var speech = document.getElementById('speech');
  var robot = document.getElementById('robot');
  var scoreEl = document.getElementById('score');
  var wrongEl = document.getElementById('wrong-count');
  var accuracyEl = document.getElementById('accuracy');
  var categoryPill = document.getElementById('category-pill');
  var targetIcon = document.getElementById('target-icon');
  var wordDisplay = document.getElementById('word-display');
  var winScreen = document.getElementById('win-screen');

  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  function getAudioCtx(){ if(!actx){ actx = new AudioCtx(); } return actx; }

  function playTone(freq, start, dur, type, vol){
    if(!soundEnabled) return;
    try{
      var c = getAudioCtx();
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = vol || 0.12;
      o.connect(g); g.connect(c.destination);
      var t = c.currentTime + start;
      o.start(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.stop(t + dur + 0.02);
    }catch(e){}
  }

  function soundCorrect(){ playTone(587, 0, 0.08, 'sine', 0.12); playTone(880, 0.06, 0.1, 'sine', 0.12); }
  function soundWrong(){ playTone(200, 0, 0.14, 'sawtooth', 0.1); }
  function soundWordWin(){ 
    [523, 659, 784, 1047].forEach(function(f,i){ playTone(f, i*0.08, 0.15, 'triangle', 0.14); }); 
  }
  function soundGameWin(){
    [523,659,784,880,1047].forEach(function(f,i){ playTone(f, i*0.12, 0.2, 'triangle', 0.15); });
  }

  function say(text){
    speech.textContent = text;
    speech.classList.remove('pulse'); void speech.offsetWidth; speech.classList.add('pulse');
  }

  function bounceRobot(){
    robot.classList.remove('bounce','shake'); void robot.offsetWidth; robot.classList.add('bounce');
  }

  function shakeRobot(){
    robot.classList.remove('bounce','shake'); void robot.offsetWidth; robot.classList.add('shake');
  }

  function buildVirtualKeyboard(){
    KEYBOARD_ROWS.forEach(function(rowKeys, rIdx){
      var rowEl = document.getElementById('row-' + (rIdx + 1));
      rowEl.innerHTML = '';
      rowKeys.forEach(function(keyStr){
        var keyBtn = document.createElement('div');
        keyBtn.className = 'key';
        keyBtn.textContent = keyStr;
        keyBtn.dataset.key = keyStr;
        keyMap[keyStr] = keyBtn;

        keyBtn.addEventListener('pointerdown', function(e){
          e.preventDefault();
          processInput(keyStr);
        });

        rowEl.appendChild(keyBtn);
      });
    });
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var temp = a[i]; a[i] = a[j]; a[j] = temp;
    }
    return a;
  }

  function initGame(){
    score = 0;
    wrongCount = 0;
    correctKeyPresses = 0;
    totalKeyPresses = 0;
    
    updateStatsDisplay();

    // Filter list based on selected category
    var filtered = WORD_BANK.filter(function(item){
      return selectedCategory === "ALL" || item.cat === selectedCategory;
    });

    currentList = shuffle(filtered);
    currentIndex = 0;
    loadWord();
  }

  function updateStatsDisplay(){
    scoreEl.textContent = score;
    wrongEl.textContent = wrongCount;
    var acc = totalKeyPresses > 0 ? Math.round((correctKeyPresses / totalKeyPresses) * 100) : 100;
    accuracyEl.textContent = acc + "%";
  }

  function loadWord(){
    if(currentIndex >= currentList.length){
      showWinScreen();
      return;
    }

    var item = currentList[currentIndex];
    charIndex = 0;

    categoryPill.textContent = item.cat;
    targetIcon.textContent = item.icon;
    
    // Icon bounce animation
    targetIcon.style.transform = 'scale(0.4)';
    setTimeout(function(){ targetIcon.style.transform = 'scale(1)'; }, 80);

    // Build Word Slots
    wordDisplay.innerHTML = '';
    for(var i = 0; i < item.word.length; i++){
      var slot = document.createElement('div');
      slot.className = 'letter-slot' + (i === 0 ? ' current' : '');
      slot.textContent = '';
      wordDisplay.appendChild(slot);
    }

    updateKeyboardHighlights();
    say("Type '" + item.word[0] + "' for " + item.word + "!");
  }

  function updateKeyboardHighlights(){
    var item = currentList[currentIndex];
    var targetChar = item ? item.word[charIndex] : null;

    Object.keys(keyMap).forEach(function(k){
      keyMap[k].classList.remove('target-key');
      if(showHint && k === targetChar){
        keyMap[k].classList.add('target-key');
      }
    });
  }

  function processInput(keyChar){
    if(currentIndex >= currentList.length) return;
    
    var keyUpper = keyChar.toUpperCase();
    var item = currentList[currentIndex];
    var expectedChar = item.word[charIndex];
    var btnEl = keyMap[keyUpper];

    totalKeyPresses++;

    if(keyUpper === expectedChar){
      // --- CORRECT KEY PRESS ---
      soundCorrect();
      correctKeyPresses++;
      
      var slot = wordDisplay.children[charIndex];
      slot.textContent = expectedChar;
      slot.classList.remove('current');
      slot.classList.add('typed');

      score += 10;
      charIndex++;

      if(charIndex < item.word.length){
        wordDisplay.children[charIndex].classList.add('current');
        updateKeyboardHighlights();
        say("Great! Next letter: '" + item.word[charIndex] + "'");
      } else {
        // --- WORD COMPLETED ---
        soundWordWin();
        bounceRobot();
        say("Awesome! You typed " + item.word + "! 🎉");
        currentIndex++;
        setTimeout(loadWord, 1100);
      }

    } else {
      // --- INCORRECT KEY PRESS ---
      soundWrong();
      shakeRobot();
      wrongCount++;

      if(btnEl){
        btnEl.classList.add('wrong-key-anim');
        setTimeout(function(){
          btnEl.classList.remove('wrong-key-anim');
        }, 280);
      }

      say("Oops! That was '" + keyUpper + "'. Press '" + expectedChar + "'!");
    }

    updateStatsDisplay();
  }

  window.addEventListener('keydown', function(e){
    if(e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toUpperCase();
    if(k >= 'A' && k <= 'Z' && k.length === 1){
      processInput(k);
      if(keyMap[k]){
        keyMap[k].classList.add('active-key');
        setTimeout(function(){ keyMap[k].classList.remove('active-key'); }, 140);
      }
    }
  });

  function showWinScreen(){
    soundGameWin();
    
    var acc = totalKeyPresses > 0 ? Math.round((correctKeyPresses / totalKeyPresses) * 100) : 100;

    document.getElementById('final-score').textContent = score;
    document.getElementById('final-misses').textContent = wrongCount;
    document.getElementById('final-accuracy').textContent = acc + "%";

    winScreen.classList.add('show');
    launchConfetti();
  }

  function launchConfetti(){
    var colors = ['#FF5A5F','#3FA7FF','#FFC93C','#4CD97B','#B57BFF'];
    for(var i=0; i<50; i++){
      (function(){
        var p = document.createElement('div');
        p.className = 'confetti-piece';
        p.style.left = (Math.random()*100)+'vw';
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        p.style.transform = 'rotate('+Math.floor(Math.random()*360)+'deg)';
        var duration = 2.2 + Math.random()*1.5;
        var delay = Math.random()*0.5;
        p.style.transition = 'transform '+duration+'s ease-in, top '+duration+'s ease-in, opacity 0.4s ease '+ (duration+delay-0.4) +'s';
        document.body.appendChild(p);
        requestAnimationFrame(function(){
          setTimeout(function(){
            p.style.top = (100+Math.random()*10)+'vh';
            p.style.transform = 'rotate('+Math.floor(Math.random()*720)+'deg)';
            p.style.opacity = '0';
          }, delay*1000);
        });
        setTimeout(function(){ p.remove(); }, (duration+delay+0.6)*1000);
      })();
    }
  }

  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      selectedCategory = btn.dataset.cat;
      initGame();
    });
  });

  document.getElementById('hint-toggle').addEventListener('click', function(){
    showHint = !showHint;
    this.style.opacity = showHint ? '1' : '0.4';
    updateKeyboardHighlights();
  });

  document.getElementById('sound-toggle').addEventListener('click', function(){
    soundEnabled = !soundEnabled;
    this.textContent = soundEnabled ? '🔊' : '🔇';
  });

  document.getElementById('skip-btn').addEventListener('click', function(){
    if(currentIndex < currentList.length){
      say("Skipped! Let's try the next word.");
      currentIndex++;
      loadWord();
    }
  });

  document.getElementById('reset-btn').addEventListener('click', function(){
    initGame();
  });

  document.getElementById('play-again').addEventListener('click', function(){
    winScreen.classList.remove('show');
    initGame();
  });

  document.getElementById('robot').addEventListener('click', function(){
    bounceRobot();
    var greetings = ["Pip loves typing!", "You are doing super!", "Keep going!", "Great job!"];
    say(greetings[Math.floor(Math.random()*greetings.length)]);
  });

  // Start Application
  buildVirtualKeyboard();
  initGame();

})();
</script>
</body>
</html>
