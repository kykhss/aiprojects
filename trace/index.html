/* Layout: a big ruled handwriting sheet (the stage) beside a sticker-style picker of letters and numbers; stacks on phones. */
:root{
  --bg:#EAF2FF; --surface:#FFFFFF; --paper:#FCFEFF;
  --ink:#14213D; --muted:#4F6189;
  --rule:#B9CFF5; --rule-strong:#E2674E;

  --go:#13A45F; --accent:#FFC72C; --on-accent:#14213D;

}
@media (prefers-color-scheme: dark){

    --bg:#0C1530; --surface:#15224A; --paper:#101B3B;
    --ink:#EDF2FF; --muted:#A3B4DB;
    --rule:#2E4A86; --rule-strong:#FF7F66;
    --road:#1D2E5F; --road-edge:#36518F; --road-dash:#7E9BE0;
    --go:#34D399; --accent:#FFC72C; --on-accent:#14213D;
    --seg-on:#EDF2FF; --seg-on-text:#0C1530; --star:#FFC72C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1530; --surface:#15224A; --paper:#101B3B;
  --ink:#EDF2FF; --muted:#A3B4DB;

  --road:#1D2E5F; --road-edge:#36518F; --road-dash:#7E9BE0;
  --go:#34D399; --accent:#FFC72C; --on-accent:#14213D;
  --seg-on:#EDF2FF; --seg-on-text:#0C1530; --star:#FFC72C;
  color-scheme:dark;
}

.card{background:var(--surface);border-radius:20px;padding:18px;min-width:0}
.stage{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--rule);display:flex;flex-direction:column;gap:12px}
.picker{border:2px solid var(--rule);display:flex;flex-direction:column;gap:14px}
.stage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h2{font:800 1.7rem/1 var(--f-display);margin:0}
.word{margin:4px 0 0;color:var(--muted)}
.counter{font:800 .9rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--bg);border-radius:999px;padding:6px 14px;white-space:nowrap}
.canvas-wrap{border:2px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--paper)}
canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.status{margin:0;min-height:3.1em;font-size:1.1rem;font-weight:800}
.keycheck{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:14px;padding:10px 14px}
.keycheck p{margin:0;font-weight:800}
.keycap{flex:none;width:58px;height:58px;display:grid;place-items:center;font:800 1.9rem var(--f-display);background:var(--surface);border:3px solid var(--ink);border-bottom-width:8px;border-radius:14px}

.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);font:800 1.05rem var(--f-display);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}

.btn.primary{background:var(--accent);color:var(--on-accent)}

.seg button{flex:1;min-height:42px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:800 1rem var(--f-display)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-text)}

.gbtn[data-done="true"] .star{display:block}
.progress{display:flex;flex-direction:column;gap:6px}
.bar{height:12px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--go);border-radius:999px;transition:width .3s}
.progress p{margin:0;font-weight:800}
.keyhint{margin:0;color:var(--muted);font-size:.9rem}
kbd{display:inline-block;min-width:1.7em;text-align:center;padding:0 6px;font:800 .85rem var(--f-body);color:var(--ink);background:var(--surface);border:2px solid var(--rule);border-bottom-width:4px;border-radius:8px}
.link{align-self:flex-start;border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px 0;font-weight:800;font-size:.9rem}
.panel{display:flex;flex-direction:column;gap:14px}
h3{margin:0;font:800 .85rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.picgroup{display:flex;flex-direction:column;gap:8px}
.picgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 6px;border-radius:14px;border:2px solid var(--rule);background:#fff;color:#1d2b4f;font:800 .95rem var(--f-display)}
.pbtn .pthumb{display:block;width:100%}
.pbtn .pthumb svg{display:block;width:100%;height:auto}
.pbtn[aria-current="true"]{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.pbtn .star{position:absolute;top:5px;right:5px;width:18px;height:18px;display:none;fill:#F5A100;stroke:#1d2b4f;stroke-width:1.4}
.pbtn[data-done="true"] .star{display:block}
.paper-wrap{border:2px solid var(--rule);border-radius:14px;overflow:hidden;background:#fff}
.paper{position:relative;aspect-ratio:4/3;background:#fff;touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;display:block;aspect-ratio:auto}
#inkPaper{cursor:crosshair;touch-action:none}
#fxCv{pointer-events:none}
.model{position:absolute;top:14px;right:10px;width:30%;min-width:110px;max-width:260px;padding:8px 6px 6px;border:3px solid #1d2b4f;border-radius:14px;background:#fff;color:#1d2b4f;box-shadow:0 4px 0 rgba(29,43,79,.25);z-index:2;cursor:zoom-in;transition:width .2s}
.model.big{width:62%;max-width:480px;cursor:zoom-out}
.model-tag{position:absolute;top:-13px;left:10px;background:#1d2b4f;color:#fff;font:800 .75rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:2px 10px;border-radius:999px}
.model svg{display:block;width:100%;height:auto}
.tools{display:flex;flex-direction:column;gap:10px}
.tool-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tool-row .seg{flex:1 1 220px}
.sizes{display:flex;gap:6px}
.sizes button{width:44px;height:44px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);display:grid;place-items:center;padding:0}
.sizes button[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.sizes i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}

.palette{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.swatch{position:relative;aspect-ratio:1;min-height:34px;border-radius:12px;border:2px solid var(--ink);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
.swatch[data-model="true"]::after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #1d2b4f}

.palette-note{margin:0;color:var(--muted);font-size:.85rem}

<div class="app">

  <div class="grid">

          <canvas id="inkPaper" width="960" height="720" role="img" aria-label="Drawing page"></canvas>

            <span class="model-tag">Model</span>
            <span id="modelArt"></span>
          </button>
        </div>
      </div>
      <div id="tools" class="tools" hidden>
        <div class="tool-row">
          <div class="seg" role="group" aria-label="Tool">
            <button type="button" data-tool="pen" aria-pressed="true">Pen</button>
            <button type="button" data-tool="fill" aria-pressed="false">Fill</button>
            <button type="button" data-tool="eraser" aria-pressed="false">Eraser</button>

            <button type="button" data-size="12" aria-label="Medium pen" aria-pressed="true"><i style="--d:12px"></i></button>
            <button type="button" data-size="22" aria-label="Thick pen" aria-pressed="false"><i style="--d:20px"></i></button>

      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="keycheck" class="keycheck" hidden>
        <span id="keycap" class="keycap">A</span>
        <p id="keytext"></p>
      </div>
      <div class="actions">
        <button id="againBtn" class="btn" type="button">Start over</button>
        <button id="finishBtn" class="btn primary" type="button" hidden>I'm finished</button>
        <button id="nextBtn" class="btn primary" type="button">Next</button>
      </div>
    </section>

    <aside class="card picker" aria-label="Choose what to practise">
      <div class="seg" role="group" aria-label="What to practise">
        <button type="button" data-section="letters" aria-pressed="true">Letters &amp; numbers</button>
        <button type="button" data-section="pictures" aria-pressed="false">Pictures</button>
      </div>
      <div id="lettersPanel" class="panel">
        <div class="seg" role="group" aria-label="Practice mode">
          <button type="button" data-mode="trace" aria-pressed="true">Trace</button>
          <button type="button" data-mode="dots" aria-pressed="false">Connect dots</button>
        </div>
        <div class="seg" role="group" aria-label="Letters or numbers">
          <button type="button" data-set="letters" aria-pressed="true">Letters</button>
          <button type="button" data-set="numbers" aria-pressed="false">Numbers</button>

        <div id="glyphGrid" class="glyphs"></div>
      </div>
      <div id="picsPanel" class="panel" hidden></div>
      <div class="progress">
        <div class="bar"><i id="barFill"></i></div>
        <p id="progressText">0 of 36 done</p>
      </div>
      <p id="keyhint" class="keyhint">Keyboard: press any letter or number key to jump to it. <kbd>&larr;</kbd> <kbd>&rarr;</kbd> change the character, <kbd>Space</kbd> starts over.</p>
      <button id="resetBtn" class="link" type="button">Reset stars</button>
    </aside>
  </div>
</div>

var cache={};
function getGlyph(ch){
  if(cache[ch])return cache[ch];
  var strokes=D[ch].map(buildStroke),seq=[],dots=[];
  strokes.forEach(function(st,si){st.key.forEach(function(ki,i){var pt=st.dense[ki];seq.push({si:si,i:i,x:pt.x,y:pt.y});});});
  seq.forEach(function(q,idx){
    q.num=idx+1;
    var d=null;
    for(var j=0;j<dots.length;j++){if(Math.hypot(dots[j].x-q.x,dots[j].y-q.y)<5){d=dots[j];break;}}
    if(!d){d={x:q.x,y:q.y,nums:[]};dots.push(d);}

/* ---------- state ---------- */
var S={section:'letters',mode:'trace',set:'letters',ch:'A',g:null,cur:0,nextIdx:[],doneS:[],complete:false,inkSegs:[],pressed:false,last:null,hue:0,nextNum:1,segs:[],particles:[],wrongAt:-1e9,sound:true,timer:0};
var DONE=new Set();
try{var raw=localStorage.getItem('letter-trails-done');if(raw)JSON.parse(raw).forEach(function(c){if(D[c])DONE.add(c);});}catch(e){}
function saveDone(){try{localStorage.setItem('letter-trails-done',JSON.stringify(Array.from(DONE)));}catch(e){}}

/* ---------- sound ---------- */
var actx=null;
function chime(notes){
  if(!S.sound)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    actx=actx||new AC();if(actx.state==='suspended')actx.resume();

      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.24);t+=0.11;
    });
  }catch(e){}
}

/* ---------- colours from CSS tokens ---------- */
function readColors(){
  var cs=getComputedStyle(document.documentElement);
  var g=function(n){return cs.getPropertyValue(n).trim();};
  C={paper:g('--paper'),rule:g('--rule'),base:g('--rule-strong'),road:g('--road'),roadEdge:g('--road-edge'),dash:g('--road-dash'),go:g('--go'),accent:g('--accent'),ink:g('--ink'),muted:g('--muted'),surface:g('--surface')};
}
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);}catch(e){}
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- layout ---------- */
function tx(x){return OX+x*SC;}
function ty(y){return OY+y*SC;}
function layout(){
  var r=cv.getBoundingClientRect();
  W=Math.round(r.width);H=Math.round(r.height);
  if(!W||!H)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;inkCv.width=W*dpr;inkCv.height=H*dpr;
  SC=Math.min(0.6*H/120,0.62*W/80);
  OX=(W-80*SC)/2;OY=0.12*H;
  redrawInk();
}
function inkStyle(){ink.setTransform(dpr,0,0,dpr,0,0);ink.lineCap='round';ink.lineJoin='round';ink.lineWidth=Math.max(6,3.2*SC);}
function drawInkSeg(s){
  ink.strokeStyle='hsl('+s.h+' 85% 58%)';
  ink.beginPath();ink.moveTo(tx(s.ax),ty(s.ay));ink.lineTo(tx(s.bx),ty(s.by));ink.stroke();
}
function redrawInk(){ink.setTransform(1,0,0,1,0,0);ink.clearRect(0,0,inkCv.width,inkCv.height);inkStyle();S.inkSegs.forEach(drawInkSeg);}
function clearInk(){S.inkSegs=[];if(inkCv.width){ink.setTransform(1,0,0,1,0,0);ink.clearRect(0,0,inkCv.width,inkCv.height);}}

/* ---------- UI helpers ---------- */
var elStatus=$('status'),elCounter=$('counter'),elKey=$('keycheck');
function setStatus(m){elStatus.textContent=m;}
function isLetter(ch){return LETTERS.indexOf(ch)>=0;}
function wordText(){return isLetter(S.ch)?S.ch+' is for '+WORDS[S.ch]+'.':S.ch+' is '+NUMW[+S.ch]+'.';}
function updateCounter(){
  var g=S.g;
  if(S.complete){elCounter.textContent=S.mode==='trace'?'All strokes done':'All dots joined';return;}
  if(S.mode==='trace')elCounter.textContent='Stroke '+Math.min(S.cur+1,g.strokes.length)+' of '+g.strokes.length;
  else elCounter.textContent='Dot '+Math.min(S.nextNum,g.seq.length)+' of '+g.seq.length;
}

}

  }

  }
}
function showSet(){

  var tabs=document.querySelectorAll('[data-set].seg button, .seg [data-set]');

/* ---------- progress control ---------- */
function resetProgress(){
  var g=S.g;
  S.cur=0;S.nextIdx=g.strokes.map(function(){return 0;});S.doneS=g.strokes.map(function(){return false;});
  S.complete=false;S.nextNum=1;S.segs=[];S.particles=[];S.pressed=false;S.last=null;
  clearInk();elKey.hidden=true;
  if(S.mode==='trace')setStatus('Press and hold on the green dot, then follow the road to trace the '+(isLetter(S.ch)?'letter ':'number ')+S.ch+'.');
  else setStatus('Click the dots in order, starting at number 1.');
  updateCounter();
}
function select(ch){
  clearTimeout(S.timer);
  S.ch=ch;S.g=getGlyph(ch);S.set=isLetter(ch)?'letters':'numbers';
  updateHead();showSet();resetProgress();updateProgress();
}
function nextOf(ch){return ALL[(ALL.indexOf(ch)+1)%ALL.length];}
function prevOf(ch){return ALL[(ALL.indexOf(ch)-1+ALL.length)%ALL.length];}

function complete(){
  if(S.complete)return;
  S.complete=true;
  if(S.mode==='trace')S.doneS=S.doneS.map(function(){return true;});
  DONE.add(S.ch);saveDone();updateProgress();updateCounter();
  setStatus(PRAISE[Math.floor(Math.random()*PRAISE.length)]+' '+wordText());
  $('keycap').textContent=S.ch;$('keycap').classList.remove('hit');
  $('keytext').textContent=coarse?'Tap Next to keep going.':'Now find the '+S.ch+' key on your keyboard and press it.';
  elKey.hidden=false;

/* ---------- geometry ---------- */
function distSeg(p,a,b){
  var dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy,t=0;
  if(l2>0){t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));}
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
function toG(px,py){return {x:(px-OX)/SC,y:(py-OY)/SC};}
function pos(e){var r=cv.getBoundingClientRect();return {px:e.clientX-r.left,py:e.clientY-r.top};}

/* ---------- tracing ---------- */
function addInk(a,b){
  S.hue=(S.hue+3)%360;
  var s={ax:a.x,ay:a.y,bx:b.x,by:b.y,h:S.hue};
  S.inkSegs.push(s);
  if(S.inkSegs.length>12000)S.inkSegs.shift();
  inkStyle();drawInkSeg(s);
}
function tracePoint(a,b){
  addInk(a,b);
  if(S.complete||S.mode!=='trace')return;
  var st=S.g.strokes[S.cur];if(!st)return;
  var tol=Math.max(12,18/SC),n=S.nextIdx[S.cur],total=st.dense.length,moved=true;
  while(moved){
    moved=false;
    var lim=Math.min(total,n+LOOK);
    for(var j=n;j<lim;j++){
      if(distSeg(st.dense[j],a,b)<=tol){n=j+1;moved=true;break;}
    }
  }
  S.nextIdx[S.cur]=n;

}
function finishStroke(){
  var st=S.g.strokes[S.cur],end=st.dense[st.dense.length-1];
  S.doneS[S.cur]=true;S.nextIdx[S.cur]=st.dense.length;
  burst(tx(end.x),ty(end.y),14);
  S.cur++;
  if(S.cur>=S.g.strokes.length){complete();}
  else{chime([660,880]);setStatus('Stroke '+S.cur+' done! Now start at the next green dot.');updateCounter();}
}

/* ---------- connect the dots ---------- */
function dotR(){return Math.max(13,Math.min(20,6*SC));}
function dotAt(px,py){
  var R=dotR(),hit=null,best=1e9;
  S.g.dots.forEach(function(d){var dd=Math.hypot(tx(d.x)-px,ty(d.y)-py);if(dd<=R+8&&dd<best){best=dd;hit=d;}});
  return hit;
}
function dotsClick(px,py){
  if(S.complete)return;
  var hit=dotAt(px,py);if(!hit)return;
  if(hit.nums.indexOf(S.nextNum)>=0){connect(S.nextNum);}
  else if(!hit.nums.every(function(n){return n<S.nextNum;})){
    S.wrongAt=performance.now();chime([220]);setStatus('Look for number '+S.nextNum+'.');
  }
}
function connect(num){
  var g=S.g,q=g.seq[num-1],st=g.strokes[q.si];
  if(q.i>0)S.segs.push({si:q.si,a:q.i-1});
  if(st.closed&&q.i===st.key.length-1)S.segs.push({si:q.si,a:q.i});
  S.nextNum++;
  if(S.nextNum>g.seq.length){complete();return;}
  chime([Math.min(1200,440+num*28)]);
  setStatus('Good! Now find number '+S.nextNum+'.');
  updateCounter();
}

/* ---------- particles ---------- */
function burst(x,y,n){
  if(reduce)return;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=140+Math.random()*320;
    S.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-220,life:1.4+Math.random()*0.6,age:0,h:Math.random()*360,sz:5+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-0.5)*10});
  }
}
function drawParticles(c,dt){
  var ps=S.particles;
  for(var i=ps.length-1;i>=0;i--){
    var p=ps[i];p.age+=dt;
    if(p.age>=p.life){ps.splice(i,1);continue;}
    p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    c.save();c.translate(p.x,p.y);c.rotate(p.rot);
    c.globalAlpha=Math.min(1,(p.life-p.age)/0.5);
    c.fillStyle='hsl('+p.h+' 90% 58%)';
    c.fillRect(-p.sz/2,-p.sz/3,p.sz,p.sz*0.6);
    c.restore();
  }
}

/* ---------- drawing ---------- */
function drawRules(){
  var ys=[ty(0),ty(60),ty(120),ty(160)];
  ctx.lineWidth=1.5;ctx.strokeStyle=C.rule;
  [0,3].forEach(function(i){ctx.beginPath();ctx.moveTo(0,ys[i]);ctx.lineTo(W,ys[i]);ctx.stroke();});
  ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,ys[1]);ctx.lineTo(W,ys[1]);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=C.base;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,ys[2]);ctx.lineTo(W,ys[2]);ctx.stroke();
}
function path(st,from,to){
  var d=st.dense;ctx.beginPath();ctx.moveTo(tx(d[from].x),ty(d[from].y));
  for(var i=from+1;i<=to&&i<d.length;i++)ctx.lineTo(tx(d[i].x),ty(d[i].y));
}
function badge(x,y,r,fill,text,textColor){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle=C.ink;ctx.stroke();
  ctx.fillStyle=textColor;ctx.font='800 '+Math.round(r*1.05)+'px "Baloo 2",system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y+r*0.06);
}
function drawTrace(now){
  var g=S.g,st,i;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(i=0;i<g.strokes.length;i++){st=g.strokes[i];path(st,0,st.dense.length-1);ctx.strokeStyle=C.roadEdge;ctx.lineWidth=(ROAD+3)*SC;ctx.stroke();}
  for(i=0;i<g.strokes.length;i++){st=g.strokes[i];path(st,0,st.dense.length-1);ctx.strokeStyle=C.road;ctx.lineWidth=ROAD*SC;ctx.stroke();}
  ctx.setLineDash([SC*4,SC*5]);ctx.strokeStyle=C.dash;ctx.lineWidth=Math.max(2,1.2*SC);
  for(i=0;i<g.strokes.length;i++){st=g.strokes[i];path(st,0,st.dense.length-1);ctx.stroke();}
  ctx.setLineDash([]);
  ctx.globalAlpha=0.5;ctx.strokeStyle=C.go;ctx.lineWidth=ROAD*0.8*SC;
  for(i=0;i<g.strokes.length;i++){
    st=g.strokes[i];var upto=S.doneS[i]?st.dense.length-1:S.nextIdx[i]-1;
    if(upto>0){path(st,0,upto);ctx.stroke();}
  }
  ctx.globalAlpha=1;
  ctx.drawImage(inkCv,0,0,W,H);

  var R1=Math.max(15,6.5*SC),R2=Math.max(11,4.5*SC);
  var pulse=reduce?0:Math.sin(now/260)*2;
  for(i=0;i<g.strokes.length;i++){
    if(S.doneS[i])continue;
    st=g.strokes[i];var p0=st.dense[0],cur=(i===S.cur&&!S.complete);
    if(cur){
      if(!st.closed){
        var e=st.dense[st.dense.length-1];
        ctx.beginPath();ctx.arc(tx(e.x),ty(e.y),Math.max(7,2.8*SC),0,Math.PI*2);ctx.fillStyle=C.accent;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=C.ink;ctx.stroke();
      }
      if(S.nextIdx[i]<10){
        var k=Math.min(10,st.dense.length-2),pa=st.dense[k-1],pb=st.dense[k+1];
        ctx.save();ctx.translate(tx(st.dense[k].x),ty(st.dense[k].y));ctx.rotate(Math.atan2(pb.y-pa.y,pb.x-pa.x));
        var as=Math.max(1,SC*0.55);
        ctx.beginPath();ctx.moveTo(9*as,0);ctx.lineTo(-6*as,-7*as);ctx.lineTo(-6*as,7*as);ctx.closePath();
        ctx.fillStyle=C.ink;ctx.globalAlpha=0.85;ctx.fill();ctx.restore();
      }
      badge(tx(p0.x),ty(p0.y),R1+pulse,C.go,String(i+1),'#fff');
    }else{
      badge(tx(p0.x),ty(p0.y),R2,C.muted,String(i+1),C.surface);
    }
  }
  if(!reduce&&!S.pressed&&!S.complete&&S.inkSegs.length===0&&S.nextIdx[S.cur]===0){
    st=g.strokes[S.cur];
    var t=(now%3200)/3200,idx=Math.floor(Math.min(1,t*1.25)*(st.dense.length-1));
    if(idx>1){ctx.globalAlpha=0.65;path(st,0,idx);ctx.strokeStyle=C.accent;ctx.lineWidth=Math.max(5,2.6*SC);ctx.stroke();ctx.globalAlpha=1;}
    var gp=st.dense[idx];
    ctx.beginPath();ctx.arc(tx(gp.x),ty(gp.y),Math.max(8,3.4*SC),0,Math.PI*2);ctx.fillStyle=C.accent;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.ink;ctx.stroke();
  }
}
function drawDots(now){
  var g=S.g,i;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(i=0;i<S.segs.length;i++){
    var sg=S.segs[i],st=g.strokes[sg.si];
    var a=st.key[sg.a],b=sg.a+1<st.key.length?st.key[sg.a+1]:st.dense.length-1;
    path(st,a,b);ctx.strokeStyle='hsl('+((i*37)%360)+' 80% 55%)';ctx.lineWidth=Math.max(6,3.4*SC);ctx.stroke();
  }
  var R=dotR(),pulse=reduce?0:Math.sin(now/240)*2.5,wrong=(now-S.wrongAt)<350;
  g.dots.forEach(function(d){
    var x=tx(d.x),y=ty(d.y);
    var isCur=!S.complete&&d.nums.indexOf(S.nextNum)>=0;
    var isDone=d.nums.every(function(n){return n<S.nextNum;});
    var fill=isCur?C.accent:(isDone?C.go:C.surface),tc=isCur?'#14213D':(isDone?'#fff':C.ink);
    var r=R+(isCur?pulse:0);
    if(isCur&&wrong){ctx.beginPath();ctx.arc(x,y,r+8,0,Math.PI*2);ctx.strokeStyle=C.base;ctx.lineWidth=4;ctx.stroke();}
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=C.ink;ctx.stroke();
    var label=d.nums.join('/');
    ctx.fillStyle=tc;ctx.font='800 '+Math.round(d.nums.length>1?R*0.72:R*1.0)+'px "Baloo 2",system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y+R*0.06);
  });
}
var lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-lastT)/1000||0);lastT=now;
  if(S.section==='pictures'){
    if(fxW){fx.setTransform(fdpr,0,0,fdpr,0,0);fx.clearRect(0,0,fxW,fxH);drawParticles(fx,dt);}
    return;
  }
  if(!W||!S.g)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);
  drawRules();
  if(S.mode==='trace')drawTrace(now);else drawDots(now);
  drawParticles(ctx,dt);
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  var p=pos(e);
  if(S.mode==='trace'){S.pressed=true;var g=toG(p.px,p.py);S.last=g;tracePoint(g,g);}
  else dotsClick(p.px,p.py);
});
cv.addEventListener('pointermove',function(e){
  var p=pos(e);
  if(S.mode==='trace'){
    if(S.pressed&&S.last){var g=toG(p.px,p.py);tracePoint(S.last,g);S.last=g;}
  }else if(S.g){cv.style.cursor=dotAt(p.px,p.py)?'pointer':'default';}
});
function release(){S.pressed=false;S.last=null;}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('pointerleave',function(){if(S.mode==='trace')return;cv.style.cursor='default';});

document.addEventListener('keydown',function(e){
  var k=e.key,onBtn=e.target&&(e.target.tagName==='BUTTON');
  if(S.section==='pictures'){
    if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undoPic();return;}
    if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
    var lk=k.toLowerCase();
    if(/^[0-9]$/.test(k)){var ci=k==='0'?9:+k-1;if(PALETTE[ci])setColor(PALETTE[ci][0]);}
    else if(lk==='p')setTool('pen');
    else if(lk==='f')setTool('fill');
    else if(lk==='e')setTool('eraser');
    else if(lk==='z')undoPic();
    else if(lk==='m')toggleModel();
    else if(k==='ArrowRight'){e.preventDefault();selectPic(nextPic(1));}
    else if(k==='ArrowLeft'){e.preventDefault();selectPic(nextPic(-1));}
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  if(/^[a-z0-9]$/i.test(k)){
    var ch=k.toUpperCase();
    if(S.complete&&ch===S.ch&&!elKey.hidden){
      $('keycap').classList.add('hit');chime([784,988]);
      clearTimeout(S.timer);S.timer=setTimeout(function(){select(nextOf(S.ch));},650);
    }else if(ch!==S.ch){select(ch);}
  }else if(k==='ArrowRight'){e.preventDefault();select(nextOf(S.ch));}
  else if(k==='ArrowLeft'){e.preventDefault();select(prevOf(S.ch));}
  else if(k===' '&&!onBtn){e.preventDefault();resetProgress();}
  else if(k==='Enter'&&!onBtn){select(nextOf(S.ch));}
});

$('againBtn').addEventListener('click',function(){
  clearTimeout(S.timer);
  if(S.section==='pictures'){pushUndo();clearPaper();setStatus('Fresh page! Look at the model and start drawing.');}
  else resetProgress();
});
$('nextBtn').addEventListener('click',function(){
  if(S.section==='pictures')selectPic(nextPic(1));else select(nextOf(S.ch));

/* pen, eraser and fill */
function setupStroke(c){
  if(P.tool==='eraser'){c.globalCompositeOperation='destination-out';c.strokeStyle='#000';c.fillStyle='#000';c.lineWidth=P.size*2.2;}
  else{c.globalCompositeOperation='source-over';c.strokeStyle=P.color;c.fillStyle=P.color;c.lineWidth=P.size;}
  c.lineCap='round';c.lineJoin='round';
}
function eachCtx(fn){fn(ictx);if(P.tool==='eraser')fn(fctx);}
function ppos(e){var r=paperInk.getBoundingClientRect();return {x:(e.clientX-r.left)*PW/r.width,y:(e.clientY-r.top)*PH/r.height};}
function floodFill(x0,y0){
  var x=Math.round(x0),y=Math.round(y0);
  if(x<0||y<0||x>=PW||y>=PH)return;
  var N=PW*PH,d=ictx.getImageData(0,0,PW,PH).data,bar=new Uint8Array(N),i;
  for(i=0;i<N;i++)bar[i]=d[i*4+3]>=60?1:0;
  var seed=y*PW+x;
  if(bar[seed]){
    seed=-1;
    for(var r=1;r<=12&&seed<0;r++){
      for(var dy=-r;dy<=r&&seed<0;dy++)for(var dx=-r;dx<=r;dx++){
        if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
        var nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=PW||ny>=PH)continue;
        if(!bar[ny*PW+nx]){seed=ny*PW+nx;break;}
      }
    }
    if(seed<0)return;
  }
  var mask=new Uint8Array(N),stack=[seed];
  while(stack.length){
    var idx=stack.pop();
    if(mask[idx]||bar[idx])continue;
    var py=Math.floor(idx/PW),px=idx-py*PW,l=px,rr=px;
    while(l>0&&!mask[py*PW+l-1]&&!bar[py*PW+l-1])l--;
    while(rr<PW-1&&!mask[py*PW+rr+1]&&!bar[py*PW+rr+1])rr++;
    for(var xx=l;xx<=rr;xx++)mask[py*PW+xx]=1;
    for(var s=-1;s<=1;s+=2){
      var ny2=py+s;if(ny2<0||ny2>=PH)continue;
      var inSpan=false;
      for(var x2=l;x2<=rr;x2++){
        var j=ny2*PW+x2,ok=!mask[j]&&!bar[j];
        if(ok&&!inSpan){stack.push(j);inSpan=true;}else if(!ok)inSpan=false;
      }
    }
  }
  var rgb=hexRgb(P.color),out=tctx.createImageData(PW,PH),o=out.data;
  for(i=0;i<N;i++)if(mask[i]){o[i*4]=rgb[0];o[i*4+1]=rgb[1];o[i*4+2]=rgb[2];o[i*4+3]=255;}
  tctx.putImageData(out,0,0);
  var a,b;
  fctx.globalCompositeOperation='destination-out';
  for(a=-2;a<=2;a++)for(b=-2;b<=2;b++)fctx.drawImage(tmpCv,a,b);
  fctx.globalCompositeOperation='source-over';
  for(a=-2;a<=2;a++)for(b=-2;b<=2;b++)fctx.drawImage(tmpCv,a,b);
  chime([520+Math.floor(Math.random()*5)*60]);
}

var HINT_P='Keyboard: <kbd>1</kbd> to <kbd>0</kbd> pick a color, <kbd>P</kbd> pen, <kbd>F</kbd> fill, <kbd>E</kbd> eraser, <kbd>Z</kbd> undo, <kbd>M</kbd> bigger model, <kbd>&larr;</kbd> <kbd>&rarr;</kbd> change picture.';
function setSection(sec){
  S.section=sec;S.particles=[];clearTimeout(S.timer);
  var pics=sec==='pictures';
  $('lettersPanel').hidden=pics;$('picsPanel').hidden=!pics;
  document.querySelector('.canvas-wrap').hidden=pics;
  $('paperWrap').hidden=!pics;$('tools').hidden=!pics;$('finishBtn').hidden=!pics;
  $('nextBtn').classList.toggle('primary',!pics);
  elKey.hidden=true;
  document.querySelectorAll('.seg [data-section]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.section===sec?'true':'false');});
  $('keyhint').innerHTML=pics?HINT_P:HINT_L;
  if(pics){
    if(!P.inited)selectPic(P.id);
    else{
      var pic=picById(P.id);
      $('glyphTitle').textContent='Draw a '+pic.name.toLowerCase();
      $('glyphWord').textContent='Copy the model in the corner, then color it.';
      setTool(P.tool,true);setStatus(TOOLHELP[P.tool]);updateProgress();
    }
  }else select(S.ch);
}
document.querySelectorAll('.seg [data-section]').forEach(function(b){b.addEventListener('click',function(){setSection(b.dataset.section);});});

/* ---------- build picker + start ---------- */
var grid=$('glyphGrid');
ALL.forEach(function(ch){
  var b=document.createElement('button');
  b.type='button';b.className='gbtn';b.dataset.ch=ch;b.dataset.set=isLetter(ch)?'letters':'numbers';b.dataset.done='false';
  b.setAttribute('aria-label',(isLetter(ch)?'Letter ':'Number ')+ch);
  b.innerHTML='<span>'+ch+'</span><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  grid.appendChild(b);
});
grid.addEventListener('click',function(e){var b=e.target.closest('.gbtn');if(b)select(b.dataset.ch);});
